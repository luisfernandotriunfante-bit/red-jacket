name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Instalar dependências (regenerar lockfile, temporario)
        run: npm install --no-audit

      - name: Publicar package-lock.json como artifact (rastreabilidade)
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high
