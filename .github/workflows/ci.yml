name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Instalar (reprodutivel se houver lockfile, senao gera um)
        run: npm ci --no-audit || npm install

      - name: Commitar package-lock.json gerado, se mudou
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet -- package-lock.json; then
            git config user.name "openbotgit[bot]"
            git config user.email "335604065+openbotgit[bot]@users.noreply.github.com"
            git commit -m "chore(backend): commita package-lock.json gerado pelo CI

          Co-authored-by: OpenBot <335604065+openbotgit[bot]@users.noreply.github.com>"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          else
            echo "package-lock.json já está sincronizado."
          fi

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high
